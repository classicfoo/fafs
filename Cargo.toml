[package]
name = "search"
version = "0.1.0"
edition = "2024"
description = "A fast desktop file and folder search utility"
license = "GPL-3.0-or-later"
default-run = "search"

[dependencies]
arboard = "3.6"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.37"
env_logger = "0.11"
filetime = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
open = "5"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
